<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Скачивание · Фабрика монтажа</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFE94A'/%3E%3Cpath d='M24 18 L48 32 L24 46 Z' fill='%23111'/%3E%3C/svg%3E">
<style>
  /* Прямое скачивание с Яндекс Диска (09.10.2026): Яндекс не даёт постоянных прямых ссылок, только временные.
     Страница берёт свежую ссылку через открытое API Яндекс Диска и сразу запускает загрузку файла.
     Не получилось: открывает обычную страницу Яндекс Диска с кнопкой «Скачать».
     Адреса платных файлов здесь НЕ хранятся (страница публичная): их приносит параметр ?u=<ссылка Яндекс Диска>
     из гайда покупателя. Без параметра страница знает только бесплатный Транскрибатор (?f=transcriber). */
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0B0C; color: #F2F2F2;
    font: 500 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .box { max-width: 460px; }
  .dot { width: 54px; height: 54px; margin: 0 auto 22px; border-radius: 50%; border: 4px solid rgba(255,233,74,.2); border-top-color: #FFE94A; animation: spin 0.9s linear infinite; }
  .done .dot { animation: none; border-color: #FFE94A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 18px; color: #A9A9AE; }
  a { color: #111; background: #FFE94A; padding: 12px 22px; border-radius: 12px; font-weight: 700; text-decoration: none; display: inline-block; }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="dot"></div>
  <h1 id="t">Скачивание начинается…</h1>
  <p id="s">Файл с Яндекс Диска сейчас начнёт загружаться. Эту страницу можно закрыть.</p>
  <a id="a" href="https://disk.yandex.ru" rel="noopener">Если не началось, нажмите здесь</a>
</div>
<script>
  const FREE = { transcriber: "https://yadi.sk/d/iaBvskzG9Tribw" };   // бесплатный подарок, его адрес не секрет
  const q = new URLSearchParams(location.search);
  // только публичные ссылки Яндекс Диска: yadi.sk и disk.yandex.<зона>, по https (иначе страницей можно увести на чужой сайт)
  const yandex = (s) => {
    try {
      const u = new URL(s);
      return u.protocol === "https:" && (u.hostname === "yadi.sk" || /^disk\.yandex\.(ru|com|kz|by|ua|uz|az|com\.tr|com\.am|com\.ge)$/.test(u.hostname)) ? u.href : "";
    } catch (e) { return ""; }
  };
  const page = yandex(q.get("u") || "") || FREE[q.get("f")] || "";
  const box = document.getElementById("box"), t = document.getElementById("t"), s = document.getElementById("s"), a = document.getElementById("a");
  if (!page) {
    box.classList.add("done");
    t.textContent = "Ссылка не найдена";
    s.textContent = "Откройте кнопку «Скачать» из гайда ещё раз.";
    a.style.display = "none";
  } else {
    a.href = page;
    const fallback = () => { s.textContent = "Открываю страницу Яндекс Диска: там нажмите «Скачать»."; location.href = page; };
    fetch("https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=" + encodeURIComponent(page))
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((d) => {
        if (!d.href || !/^https:\/\//.test(d.href)) return fallback();   // только https-ссылка от Яндекса
        a.href = d.href;
        location.href = d.href;
        setTimeout(() => { box.classList.add("done"); t.textContent = "Загрузка пошла"; }, 1500);
      })
      .catch(fallback);
  }
</script>
</body>
</html>
